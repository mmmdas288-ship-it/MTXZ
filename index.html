<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Support Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0b0e14; color: #e2e8f0; display: flex; justify-content: center; padding: 16px; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; }
    .header { text-align: center; margin-bottom: 20px; margin-top: 10px; }
    .badge { display: inline-block; background-color: rgba(56, 239, 125, 0.15); color: #38ef7d; font-size: 0.75rem; font-weight: bold; padding: 4px 12px; border-radius: 20px; border: 1px solid #38ef7d; margin-bottom: 10px; }
    .header h1 { font-size: 1.6rem; color: #ffffff; margin-bottom: 6px; }
    .header p { font-size: 0.85rem; color: #94a3b8; }
    .card { background: #141923; border: 1px solid #222c3d; border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); }
    .card h2 { font-size: 1.1rem; color: #38ef7d; margin-bottom: 16px; border-bottom: 1px solid #222c3d; padding-bottom: 8px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.8rem; color: #a0aec0; margin-bottom: 6px; font-weight: 500; }
    input, textarea { width: 100%; background: #0b0e14; border: 1px solid #2a364f; color: #ffffff; padding: 12px; border-radius: 8px; font-size: 0.9rem; }
    input:focus, textarea:focus { outline: none; border-color: #38ef7d; }
    .btn-submit { width: 100%; background: linear-gradient(135deg, #11998e, #38ef7d); color: #05130b; font-weight: bold; border: none; padding: 14px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; margin-top: 6px; }
    .btn-whatsapp { display: block; width: 100%; text-align: center; background-color: #25d366; color: #ffffff; text-decoration: none; font-weight: bold; padding: 12px; border-radius: 8px; font-size: 0.95rem; }
    .stats-card { display: flex; justify-content: space-around; text-align: center; }
    .stat-box h3 { color: #ffffff; font-size: 1.2rem; }
    .stat-box p { color: #64748b; font-size: 0.75rem; margin-top: 2px; }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="badge">OFFICIAL SUPPORT PORTAL</div>
      <h1>Customer Support Center</h1>
      <p>Submit a ticket or chat with an official moderator for quick assistance.</p>
    </header>

    <section class="card">
      <h2>Submit Support Ticket</h2>
      <form id="support-form">
        <div class="form-group">
          <label for="username">User ID / Game ID *</label>
          <input type="text" id="username" placeholder="e.g. 1928472910" required>
        </div>

        <div class="form-group">
          <label for="contact">WhatsApp / Phone Number *</label>
          <input type="tel" id="contact" placeholder="e.g. 9876543210" required>
        </div>

        <div class="form-group">
          <label for="issue">Describe Your Issue *</label>
          <textarea id="issue" rows="4" placeholder="Explain what issue you are facing..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit & Verify Ticket</button>
      </form>
    </section>

    <section class="card">
      <h2>Direct Moderator Help</h2>
      <div class="support-buttons">
        <a href="https://wa.me/919876543210" target="_blank" class="btn-whatsapp">
          💬 Chat on WhatsApp Support
        </a>
      </div>
    </section>

    <section class="card stats-card">
      <div class="stat-box">
        <h3>10,000+</h3>
        <p>Tickets Resolved</p>
      </div>
      <div class="stat-box">
        <h3>24x7</h3>
        <p>Active Support</p>
      </div>
    </section>
  </div>

  <script>
    document.getElementById('support-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const userId = document.getElementById('username').value;
      alert(`Thank you! Support ticket submitted successfully for User ID: ${userId}.`);
      this.reset();
    });
  </script>
</body>
</html>
